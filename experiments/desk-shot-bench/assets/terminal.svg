<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t-title t-desc">
  <title id="t-title">终端屏幕素材 · 镜头设计／桌面场景（画面模拟）</title>
  <desc id="t-desc">原创占位终端界面，暗灰底橙色强调，内容为虚构镜头设计条目，不含真实日志、账户、人名、路径或品牌。</desc>
  <defs>
    <style>
      .mono{font-family:"JetBrains Mono","Fira Code","SF Mono",Menlo,"Noto Sans Mono CJK SC","Sarasa Mono SC","Microsoft YaHei",monospace}
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif}
      .txt{fill:#E8E8E8}
      .dim{fill:#9A9A9A}
      .acc{fill:#D77757}
      .ok{fill:#4EBA65}
    </style>
    <radialGradient id="t-glow" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </radialGradient>
  </defs>

  <!-- 屏幕底：整幅深色，可直接作为笔记本屏幕贴图 -->
  <rect id="screen-bg" x="0" y="0" width="1920" height="1080" fill="url(#t-glow)"/>

  <!-- 标题栏（通用，无品牌） -->
  <g id="titlebar">
    <rect x="0" y="0" width="1920" height="64" fill="#2E2E2E"/>
    <rect x="0" y="64" width="1920" height="2" fill="#3C3C3C"/>
    <circle cx="44" cy="32" r="9" fill="#5A5A5A"/>
    <circle cx="74" cy="32" r="9" fill="#5A5A5A"/>
    <circle cx="104" cy="32" r="9" fill="#5A5A5A"/>
    <text class="cn dim" x="960" y="42" font-size="26" text-anchor="middle">终端 — 镜头工作台</text>
  </g>

  <!-- 显著角标 -->
  <g id="badge">
    <rect x="1400" y="96" width="480" height="84" rx="14" fill="#D77757"/>
    <rect x="1408" y="104" width="464" height="68" rx="9" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="cn" x="1640" y="152" font-size="40" font-weight="700" fill="#1A1A1A" text-anchor="middle">画面模拟·私有样片</text>
  </g>

  <!-- 欢迎/标题面板：橙色虚线框，标题嵌入上边框 -->
  <g id="panel">
    <rect x="80" y="130" width="1260" height="330" rx="10" fill="none" stroke="#D77757" stroke-width="3" stroke-dasharray="12 8"/>
    <rect x="112" y="108" width="430" height="44" fill="#1F1F1F"/>
    <text class="cn acc" x="126" y="143" font-size="34" font-weight="700">镜头设计 · S2-3</text>

    <!-- 原创图标：取景框 + 桌面线（非吉祥物） -->
    <g id="icon" transform="translate(130 200)">
      <rect x="0" y="0" width="200" height="200" rx="18" fill="#2A2A2A" stroke="#D77757" stroke-width="3"/>
      <path d="M30 60V30H60M140 30H170V60M170 140V170H140M60 170H30V140" fill="none" stroke="#D77757" stroke-width="8" stroke-linecap="round"/>
      <rect x="62" y="70" width="76" height="48" rx="4" fill="none" stroke="#E8E8E8" stroke-width="5"/>
      <path d="M50 140H150" stroke="#E8E8E8" stroke-width="5" stroke-linecap="round"/>
      <path d="M86 128H114" stroke="#9A9A9A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <text class="cn txt" x="380" y="250" font-size="54" font-weight="700">从终端，缩到书桌</text>
    <text class="cn dim" x="380" y="310" font-size="32">时长 22 秒 · 一个镜头 · 原创占位角色</text>
    <path d="M380 345H1300" stroke="#D77757" stroke-width="2" stroke-dasharray="10 8"/>
    <text class="cn txt" x="380" y="400" font-size="32"><tspan class="acc" font-weight="700">场景</tspan>  深夜书桌 · 只有屏幕光</text>
    <text class="cn txt" x="380" y="444" font-size="32"><tspan class="acc" font-weight="700">主角</tspan>  小螃蟹（占位）落在键盘上</text>
  </g>

  <!-- 侧栏：桌面场景清单 -->
  <g id="sidebar">
    <rect x="1400" y="220" width="480" height="240" rx="10" fill="#242424" stroke="#3C3C3C" stroke-width="2"/>
    <text class="cn acc" x="1430" y="270" font-size="32" font-weight="700">桌面场景</text>
    <text class="cn txt" x="1430" y="320" font-size="28">· 笔记本 · 屏幕微光</text>
    <text class="cn txt" x="1430" y="362" font-size="28">· 线圈本 · 两支笔</text>
    <text class="cn txt" x="1430" y="404" font-size="28">· 一袋零食 · 暗角</text>
    <text class="cn dim" x="1430" y="444" font-size="24">（示意清单，非实拍）</text>
  </g>

  <!-- 输出区：大字号关键条目，缩小后仍可辨认 -->
  <g id="output">
    <text id="line-prompt" class="cn txt" x="80" y="540" font-size="34"><tspan class="acc" font-weight="700">›</tspan>  帮我排一下这个镜头</text>

    <g id="line-1">
      <circle cx="96" cy="596" r="11" class="ok"/>
      <text class="cn txt" x="128" y="608" font-size="40" font-weight="700">镜头 1　终端画面 → 缓慢缩出</text>
    </g>
    <g id="line-2">
      <circle cx="96" cy="664" r="11" class="ok"/>
      <text class="cn txt" x="128" y="676" font-size="40" font-weight="700">镜头 2　露出笔记本与书桌</text>
    </g>
    <g id="line-3">
      <circle cx="96" cy="732" r="11" class="ok"/>
      <text class="cn txt" x="128" y="744" font-size="40" font-weight="700">镜头 3　小螃蟹跳下，落在键盘</text>
    </g>
    <text id="line-3-sub" class="cn dim" x="128" y="792" font-size="28">⎿  落点：键盘中央 · 轻弹一下 · 屏幕光打在壳上</text>

    <g id="line-4">
      <circle cx="96" cy="846" r="11" class="acc"/>
      <text class="cn txt" x="128" y="858" font-size="40" font-weight="700">镜头 4　停住，留白收尾</text>
    </g>
  </g>

  <!-- 状态行 + 输入行 -->
  <g id="status">
    <text id="spinner" class="cn acc" x="80" y="926" font-size="30">✻ <tspan class="txt">排镜头中…</tspan> <tspan class="dim">（示意 · 非真实运行记录）</tspan></text>
    <rect x="80" y="958" width="1760" height="2" fill="#5A5A5A"/>
    <text class="cn acc" x="80" y="1018" font-size="36" font-weight="700">›</text>
    <rect id="cursor" x="118" y="988" width="20" height="38" fill="#D0D0D0"/>
    <text class="cn dim" x="156" y="1018" font-size="28">输入下一步镜头…</text>
    <text class="cn dim" x="1840" y="1018" font-size="24" text-anchor="end">画面模拟 · 私有样片</text>
  </g>
</svg>
