name: render-video

# 按需渲染：不占她那台机器的 CPU，跑完就把 mp4 作为 artifact 交回来。
# ubuntu-latest = 4 vCPU / 16 GB —— 就是所谓的 4C16G，Remotion 官方推荐配置。
on:
  workflow_dispatch:
    inputs:
      title:
        description: 主标题（一句话，16:9 横屏，14 字以内好排版）
        required: true
        type: string
      subtitle:
        description: 副标题
        required: false
        default: ""
        type: string
      kicker:
        description: 角标（默认 ANTHROPOS）
        required: false
        default: ANTHROPOS
        type: string
      accent:
        description: 主色（#RRGGBB）
        required: false
        default: "#FF6B6B"
        type: string
      seconds:
        description: 时长（秒）
        required: false
        default: "15"
        type: string
      segments:
        description: 配音时间轴（JSON 字符串，给了就按它切场景）
        required: false
        default: ""
        type: string
      project:
        description: 自定义工程名（videoproj/<name>/src），留空用内置模板
        required: false
        default: ""
        type: string
      frames:
        description: 只渲染指定帧范围（例如 0-779），留空渲染全部。调试用，省时间
        required: false
        default: ""
        type: string

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    # 4 vCPU / 16 GB / 14 GB SSD，公开仓库免费额度 2000 分钟/月
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ⚠️ runner 默认没有中文字体，不装这个，渲出来全是「□」
      - name: 装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装依赖
        working-directory: video
        run: npm install --no-audit --no-fund

      # 自定义工程：源码唯一权威位置是仓库根的 videoproj/<name>/src/
      # （2026-11-07 起。以前用 video/projects/<name>/src —— 那个目录只在渲染那一刻
      #   被写入，她之后改的代码不会进去，仓库里存的是过时快照，
      #   而且只收代码文件，public 素材和 brief.md 从来没上过。）
      # 直接覆盖内置的 src/，入口约定还是 src/index.ts
      - name: 切换到自定义工程
        if: ${{ inputs.project != '' }}
        working-directory: video
        run: |
          set -eu
          PROJ="${{ inputs.project }}"
          echo "使用工程：$PROJ"
          if [ ! -d "../videoproj/$PROJ/src" ]; then
            echo "::error::仓库里没有 videoproj/$PROJ/src —— 源码没推上来，拒绝退回内置模板"
            exit 1
          fi
          rm -rf src
          cp -r "../videoproj/$PROJ/src" src
          # 项目自带素材（logo / 截图）在 videoproj/<name>/public/，
          # 以前要人肉复制进 video/public/assets，漏一次画面就缺一块
          if [ -d "../videoproj/$PROJ/public" ]; then
            mkdir -p public
            cp -r "../videoproj/$PROJ/public/." public/
            echo "素材已并入 video/public/"
          fi
          echo "--- 覆盖后的 src（前 40 行）---"
          ls -R src | head -40
          echo "--- public ---"
          ls public 2>/dev/null | head -20

      - name: 准备无头浏览器
        working-directory: video
        run: npx remotion browser ensure

      - name: 写渲染参数
        working-directory: video
        env:
          TITLE: ${{ inputs.title }}
          SUBTITLE: ${{ inputs.subtitle }}
          KICKER: ${{ inputs.kicker }}
          ACCENT: ${{ inputs.accent }}
          SECONDS: ${{ inputs.seconds }}
          SEGMENTS: ${{ inputs.segments }}
        run: |
          node -e '
            const fs = require("fs");
            let segments = [];
            try { if (process.env.SEGMENTS) segments = JSON.parse(process.env.SEGMENTS); } catch (e) { console.error("segments 解析失败，按无时间轴处理"); }
            const props = {
              title: process.env.TITLE || "",
              subtitle: process.env.SUBTITLE || "",
              kicker: process.env.KICKER || "ANTHROPOS",
              accent: process.env.ACCENT || "#FF6B6B",
              seconds: Number(process.env.SECONDS || 15),
              segments,
            };
            fs.writeFileSync("props.json", JSON.stringify(props, null, 2));
            console.log("props:", JSON.stringify({ ...props, segments: segments.length + " 段" }));
          '

      - name: 渲染
        working-directory: video
        env:
          FRAMES: ${{ inputs.frames }}
        run: |
          if [ -n "$FRAMES" ]; then
            echo "只渲染帧范围：$FRAMES"
            npx remotion render src/index.ts AnthroposVideo out/video.mp4 \
              --frames="$FRAMES" \
              --props=props.json \
              --concurrency=4 \
              --log=info
          else
            echo "渲染全部帧"
            npx remotion render src/index.ts AnthroposVideo out/video.mp4 \
              --props=props.json \
              --concurrency=4 \
              --log=info
          fi

      - name: 产物信息
        working-directory: video
        run: ls -lh out/ && du -h out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video/out/video.mp4
          retention-days: 7
