name: desk-shot-parallel-20

# 660 frames, 20 jobs of 33 frames each.
# 不新建仓库，只在本仓库内并行，符合 GitHub 的使用条款。

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
    steps:
      - id: p
        run: |
          echo 'chunks=[{"name":"00","frames":"0-32"},{"name":"01","frames":"33-65"},{"name":"02","frames":"66-98"},{"name":"03","frames":"99-131"},{"name":"04","frames":"132-164"},{"name":"05","frames":"165-197"},{"name":"06","frames":"198-230"},{"name":"07","frames":"231-263"},{"name":"08","frames":"264-296"},{"name":"09","frames":"297-329"},{"name":"10","frames":"330-362"},{"name":"11","frames":"363-395"},{"name":"12","frames":"396-428"},{"name":"13","frames":"429-461"},{"name":"14","frames":"462-494"},{"name":"15","frames":"495-527"},{"name":"16","frames":"528-560"},{"name":"17","frames":"561-593"},{"name":"18","frames":"594-626"},{"name":"19","frames":"627-659"}]' >> $GITHUB_OUTPUT

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        working-directory: experiments/desk-shot-bench
        run: npm ci --no-audit --no-fund
      - name: 渲染该段
        working-directory: experiments/desk-shot-bench
        run: |
          mkdir -p out
          START=$(date +%s)
          npx remotion render src/index.ts DeskShot out/part-${{ matrix.chunk.name }}.mp4 \
            --codec=h264 --frames=${{ matrix.chunk.frames }}
          echo "SEG_${{ matrix.chunk.name }}=$(( $(date +%s) - START ))s" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.name }}
          path: experiments/desk-shot-bench/out/

  merge:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: 按序合并
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ls parts/*.mp4 | sort | sed "s/^/file '/;s/$/'/" > list.txt
          ffmpeg -f concat -safe 0 -i list.txt -c copy merged.mp4
          ls -lh merged.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: merged
          path: merged.mp4
