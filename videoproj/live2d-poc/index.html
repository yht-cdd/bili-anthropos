<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden}
  canvas{display:block}
</style>
<script>
  window.LOG = [];
  const push = (...a) => { try { window.LOG.push(a.map(x => String(x)).join(" ").slice(0, 300)); if (window.LOG.length > 200) window.LOG.shift(); } catch (e) {} };
  window.onerror = (m, s, l, c, err) => push("onerror:", m, s + ":" + l, err && err.stack);
  window.addEventListener("unhandledrejection", (e) => push("unhandled:", e.reason && (e.reason.stack || e.reason.message) || e.reason));
  const _log = console.log, _warn = console.warn, _err = console.error;
  console.log = (...a) => (push("log:", ...a), _log(...a));
  console.warn = (...a) => (push("warn:", ...a), _warn(...a));
  console.error = (...a) => (push("error:", ...a), _err(...a));
</script>
</head>
<body>
<script src="vendor/pixi/pixi.min.js"></script>
<script src="vendor/cubism/live2dcubismcore.min.js"></script>
<script src="vendor/pixi/live2d.min.js"></script>
<script src="vendor/wawa/wawa-lipsync.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
